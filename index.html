
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">

    <title>Torneo ITF</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app">
        <section id="pantalla-inicio" class="pantalla activa">

            <h1>Torneo ITF</h1>

            <p>¿Quién eres?</p>

            <div class="opciones">

                <button id="btn-participante" class="boton-rol">
                    <i data-lucide="user-round"></i>
                    <span>Participante</span>
                </button>

                <button id="btn-profesor" class="boton-rol">
                    <i data-lucide="users-round"></i>
                    <span>Profesor</span>
                </button>

                <button id="btn-organizador" class="boton-rol">
                    <i data-lucide="shield"></i>
                    <span>Organizador</span>
                </button>
            </div>
        </section>
        
        <!-- =================================
         PANTALLA DE PARTICIPANTE
         ================================= -->
        
        <section id="pantalla-participante" class="pantalla">
            <h1>Participante</h1>
            <p>¿Qué deseas hacer?</p>

            <div class="opciones">
                <button id="btn-ver-participantes" class="boton-rol">
                    <i data-lucide="users-round"></i>
                    Ver participantes
                </button>

                <button id="btn-inscribirme" class="boton-rol">
                    <i data-lucide="clipboard-pen-line"></i>
                    Inscribirme
                </button>

                <button class="btn-volver">Volver</button>
            </div>
        </section>


        <!-- =================================
        INICIO DE SESIÓN DEL PROFESOR
        ================================= -->

        <section id="pantalla-login-profesor" class="pantalla">
            <h1>Profesor</h1>
            <p>Iniciá sesión para continuar</p>

            <form id="form-profesor" class="formulario-login">
                <input
                    type="text"
                    id="usuario-profesor"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password-profesor"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="mensaje-profesor" class="mensaje-login"></p>

            <button class="btn-volver">Volver</button>
        </section>

        <!-- =================================
        MENÚ DEL PROFESOR
        ================================= -->

        <section id="pantalla-menu-profesor" class="pantalla">
            <h1>Profesor</h1>
            <p>Seleccioná una opción</p>

            <div class="opciones">
                <button id="btn-menu-ver-participantes" class="boton-rol">
                    <i data-lucide="users-round"></i>
                    Ver participantes
                </button>

                <button id="btn-inscribir-alumnos" class="boton-rol">
                    <i data-lucide="clipboard-pen-line"></i>
                    Inscribir alumnos
                </button>

                <button class="btn-volver">Volver</button>
            </div>
        </section>

        <!-- =================================
        INICIO DE SESIÓN DEL ORGANIZADOR
        ================================= -->

        <section id="pantalla-login-organizador" class="pantalla">
            <h1>Organizador</h1>
            <p>Iniciá sesión para continuar</p>

            <form id="form-organizador" class="formulario-login">
                <input
                    type="text"
                    id="usuario-organizador"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password-organizador"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="mensaje-organizador" class="mensaje-login"></p>

            <button class="btn-volver">Volver</button>
        </section>


        <!-- =================================
        MENÚ DEL ORGANIZADOR
        ================================= -->

        <section id="pantalla-menu-organizador" class="pantalla">
            <h1>Organizador</h1>
            <p>Panel de organización</p>

            <div class="opciones">
                <button id="btn-administracion">
                    Administración
                </button>

                <button class="btn-volver">Volver</button>
            </div>
        </section>

        <!-- =================================
        PANTALLA PROVISIONAL
        ================================= -->

        <section id="pantalla-provisional" class="pantalla">
            <h1>¡Ups!</h1>
            <p id="texto-provisional"></p>

            <button class="btn-volver">Volver</button>
        </section>

        <button id="btn-tema" class="boton-tema" aria-label="Cambiar tema">
            <i data-lucide="sun"></i>
        </button>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>
</html>
